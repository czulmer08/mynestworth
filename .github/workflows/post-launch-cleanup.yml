name: NestBest post-launch cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/post-launch-cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonicalize domain and add transition notice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if '<link rel="canonical" href="https://mynestbest.com/">' not in s:
              s=s.replace('<meta name="description" content="Your budget, your savings, and your net worth — quietly in your pocket. Private, no download, works right in your browser.">', '<meta name="description" content="Your budget, your savings, and your net worth — quietly in your pocket. Private, no download, works right in your browser.">\n<link rel="canonical" href="https://mynestbest.com/">', 1)
          s=s.replace('<meta property="og:image" content="nestbest-social-preview.png">', '<meta property="og:url" content="https://mynestbest.com/">\n<meta property="og:image" content="https://mynestbest.com/nestbest-social-preview.png">', 1)
          s=s.replace('<meta name="twitter:image" content="nestbest-social-preview.png">', '<meta name="twitter:image" content="https://mynestbest.com/nestbest-social-preview.png">', 1)
          if '.transition-note{' not in s:
              s=s.replace('  .cta-note{font-size:13.5px;color:var(--ink-2);margin-top:12px}', '  .cta-note{font-size:13.5px;color:var(--ink-2);margin-top:12px}\n  .transition-note{margin:16px auto 0;max-width:520px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--green-soft);color:var(--ink-2);font-size:14px;text-align:center}\n  .transition-note b{color:var(--ink)}', 1)
          marker='    <div class="cta-note">Free · nothing to install · works right in your browser</div>\n  </div>'
          note='    <div class="cta-note">Free · nothing to install · works right in your browser</div>\n    <div class="transition-note"><b>NestWorth is now NestBest™.</b> Your existing budgets stay in your Google Drive and continue to work here — no data migration required.</div>\n  </div>'
          if 'NestWorth is now NestBest™.' not in s:
              if marker not in s: raise SystemExit('CTA marker not found')
              s=s.replace(marker,note,1)
          p.write_text(s)
          PY
      - name: Remove temporary deployment workflows and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .github/workflows/deploy-nestbest-gate-a.yml .github/workflows/post-launch-cleanup.yml
          git commit -m 'Finalize NestBest canonical domain and transition notice'
          git push origin HEAD:main
